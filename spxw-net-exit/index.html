<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>SPXW Net Exit Calculator</title><style>html,body{margin:0;background:#07111f;color:#f5f8fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center}.spin{width:34px;height:34px;border:3px solid #243b58;border-top-color:#70e7be;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="loading"><div><div class="spin"></div><b>SPXW Net Exit Calculator</b><div style="color:#91a5bf;margin-top:8px">Cargando v5…</div></div></div><script>(async()=>{try{const u=[0,1,2,3,4,5,6,7].map(i=>'./chunks/'+String(i).padStart(3,'0')+'.txt');const a=await Promise.all(u.map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(x+' '+r.status);return r.text()})));const bin=atob(a.join('')),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0)),html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div><b>No se pudo cargar la calculadora.</b><pre style="color:#ff8097;white-space:pre-wrap">'+String(e)+'</pre></div></div>'}})();</script></body></html>
