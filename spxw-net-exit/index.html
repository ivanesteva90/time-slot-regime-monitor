<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101c"><title>SPXW Net Exit Trade Manager</title><style>html,body{margin:0;background:#06101c;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.spinner{width:34px;height:34px;border:3px solid #263a56;border-top-color:#6ee7b7;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="loading"><div><div class="spinner"></div><b>SPXW Net Exit Trade Manager</b><div style="color:#9fb0c8;margin-top:8px">Cargando…</div></div></div><script>
(async()=>{
try{
  const u=['./chunks/000.txt','./chunks/001.txt','./chunks/002.txt','./chunks/003.txt','./chunks/004.txt','./chunks/005.txt','./chunks/006.txt','./chunks/007.txt','./chunks/008.txt','./chunks/009.txt'];
  const a=await Promise.all(u.map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(x+' '+r.status);return r.text()})));
  let html=a.join('').replace('<div class="badge" id="brokerBadge">Robinhood Gold · SPXW</div>','');
  const quickAnchor='<div class="quick" id="quickBtns"></div>';
  const customBox=`${quickAnchor}<div id="customTargetWrapLive" style="display:flex;align-items:center;gap:8px;margin-top:9px;padding:8px;border:1px solid #314865;background:#081322;border-radius:12px;max-width:340px;transition:.15s ease"><span style="font-weight:900;color:#9fb0c8">$</span><input id="customNetTargetLive" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Otro objetivo NETO" aria-label="Objetivo NETO personalizado" style="flex:1;min-width:0;background:transparent;color:#f4f7fb;border:0;outline:0;font-size:16px;padding:8px 2px"><button type="button" id="applyCustomNetLive" style="border:1px solid #315b78;background:#0c2031;color:#dbeeff;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap">Usar</button></div><div style="font-size:10px;color:#71839b;margin-top:5px">Escribe cualquier objetivo NETO (ej. 27, 43.50, 85) y pulsa Usar o Enter.</div>`;
  html=html.replace(quickAnchor,customBox);
  const enhancer='<scr'+'ipt>(()=>{const i=document.getElementById("customNetTargetLive"),b=document.getElementById("applyCustomNetLive"),w=document.getElementById("customTargetWrapLive");if(!i||!b||!w)return;function apply(){const v=parseFloat(i.value);if(!Number.isFinite(v)||v<0){i.focus();return;}document.getElementById("target").value=v.toFixed(2);syncTargetFields("dollars");update();}b.addEventListener("click",apply);i.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();apply();}});document.querySelectorAll("[data-dollar-target],[data-pct-target],#apply3050,#apply3015,#apply2550").forEach(x=>x.addEventListener("click",()=>{i.value="";w.style.borderColor="#314865";w.style.boxShadow="none";}));const old=updateSelectionVisuals;updateSelectionVisuals=function(){old();const v=parseFloat(i.value),t=parseFloat(document.getElementById("target").value)||0,on=Number.isFinite(v)&&Math.abs(v-t)<0.01;w.style.borderColor=on?"#6ee7b7":"#314865";w.style.boxShadow=on?"0 0 0 2px rgba(110,231,183,.18)":"none";};updateSelectionVisuals();})();</scr'+'ipt>';
  html=html.replace('</body>',enhancer+'</body>');
  document.open();document.write(html);document.close();
}catch(e){document.body.innerHTML='<div class="loading"><div><b>No se pudo cargar la aplicación.</b><pre style="white-space:pre-wrap;color:#fb7185">'+String(e)+'</pre></div></div>'}
})();
</script></body></html>
