<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101c"><title>SPXW Net Exit Trade Manager</title><style>html,body{margin:0;background:#06101c;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.spinner{width:34px;height:34px;border:3px solid #263a56;border-top-color:#6ee7b7;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="loading"><div><div class="spinner"></div><b>SPXW Net Exit Trade Manager</b><div style="color:#9fb0c8;margin-top:8px">Cargando…</div></div></div><script>(async()=>{try{const u=['./chunks/000.txt','./chunks/001.txt','./chunks/002.txt','./chunks/003.txt','./chunks/004.txt','./chunks/005.txt','./chunks/006.txt','./chunks/007.txt','./chunks/008.txt','./chunks/009.txt'];const a=await Promise.all(u.map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(x+' '+r.status);return r.text()})));const html=a.join('').replace('<div class="badge" id="brokerBadge">Robinhood Gold · SPXW</div>','');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div><b>No se pudo cargar la aplicación.</b><pre style="white-space:pre-wrap;color:#fb7185">'+String(e)+'</pre></div></div>'}})();</script></body></html>
