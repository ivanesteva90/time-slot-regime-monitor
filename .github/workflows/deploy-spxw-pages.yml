name: Deploy SPXW Net Exit Trade Manager

on:
  push:
    branches: ["gh-pages"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "spxw-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload SPXW site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./spxw-net-exit
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
